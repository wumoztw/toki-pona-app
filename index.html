<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toki Pona Mastery - 從零開始學到會</title>
    
    <!-- 1. 引入 Tailwind CSS (樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Washi Design System Tailwind Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              washi: { bg: '#faf9f7', surface: '#f5f3ef', sidebar: '#f0ede8', border: '#e0dbd3', hover: '#ece8e2' },
              sumi: { DEFAULT: '#2c2825', secondary: '#6b6460', tertiary: '#9e9590' },
              'washi-accent': '#8a9ba8',
              'washi-amber': '#b09070',
              'washi-green': '#7a9b80',
              'washi-rose': '#b08088',
            },
          },
        },
      };
    </script>
    
    <!-- 2. 引入 React 核心 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 引入 Babel (翻譯機) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 4. 引入 Phosphor Icons (圖示庫) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 5. 引入 抽離的 VOCAB_DATA 資料 -->
    <script src="./data.js"></script>

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TokiPona">
    <link rel="apple-touch-icon" href="./icon.svg">

    <style>
        @font-face {
            font-family: 'linja-pona';
            src: url('./linja-pona.otf') format('opentype');
            font-display: swap;
        }
        .sitelen-pona {
            font-family: 'linja-pona', sans-serif;
            font-feature-settings: "liga" 1, "clig" 1, "calt" 1, "kern" 1, "mark" 1;
            text-rendering: optimizeLegibility;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f0ede8; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c8c3bc; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #b5a8a0; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #faf9f7; color: #2c2825; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- 圖示組件封裝 ---
        const IconWrapper = ({ iconClass, size = 20, className = "" }) => (
            <i className={`${iconClass} ${className}`} style={{ fontSize: size, verticalAlign: 'middle', display: 'inline-block' }}></i>
        );

        // --- 圖示對應表與輔助函式 ---
        const ICONS_MAP = {
          Book: (p) => <IconWrapper iconClass="ph-bold ph-book" {...p} />,
          Users: (p) => <IconWrapper iconClass="ph-bold ph-users" {...p} />,
          Layers: (p) => <IconWrapper iconClass="ph-bold ph-stack" {...p} />,
          Clock: (p) => <IconWrapper iconClass="ph-bold ph-clock" {...p} />,
          Briefcase: (p) => <IconWrapper iconClass="ph-bold ph-briefcase" {...p} />,
          Activity: (p) => <IconWrapper iconClass="ph-bold ph-activity" {...p} />,
          Home: (p) => <IconWrapper iconClass="ph-bold ph-house" {...p} />,
          Globe: (p) => <IconWrapper iconClass="ph-bold ph-globe" {...p} />,
          Feather: (p) => <IconWrapper iconClass="ph-bold ph-feather" {...p} />,
          Palette: (p) => <IconWrapper iconClass="ph-bold ph-palette" {...p} />,
          Zap: (p) => <IconWrapper iconClass="ph-bold ph-lightning" {...p} />,
          PenTool: (p) => <IconWrapper iconClass="ph-bold ph-pen-nib" {...p} />,
          FileText: (p) => <IconWrapper iconClass="ph-bold ph-file-text" {...p} />,
          MessageSquare: (p) => <IconWrapper iconClass="ph-bold ph-chat-circle" {...p} />
        };

        const renderIcon = (iconKey, size = 20) => {
          const IconComponent = ICONS_MAP[iconKey] || ICONS_MAP.Book;
          return <IconComponent size={size} />;
        };

        const Book = (p) => <IconWrapper iconClass="ph-bold ph-book" {...p} />;
        const MessageSquare = (p) => <IconWrapper iconClass="ph-bold ph-chat-circle" {...p} />;
        const Feather = (p) => <IconWrapper iconClass="ph-bold ph-feather" {...p} />;
        const Sun = (p) => <IconWrapper iconClass="ph-bold ph-sun" {...p} />;
        const Home = (p) => <IconWrapper iconClass="ph-bold ph-house" {...p} />;
        const Users = (p) => <IconWrapper iconClass="ph-bold ph-users" {...p} />;
        const Activity = (p) => <IconWrapper iconClass="ph-bold ph-activity" {...p} />;
        const Layers = (p) => <IconWrapper iconClass="ph-bold ph-stack" {...p} />;
        const Volume2 = (p) => <IconWrapper iconClass="ph-bold ph-speaker-high" {...p} />;
        const Search = (p) => <IconWrapper iconClass="ph-bold ph-magnifying-glass" {...p} />;
        const ChevronRight = (p) => <IconWrapper iconClass="ph-bold ph-caret-right" {...p} />;
        const Hash = (p) => <IconWrapper iconClass="ph-bold ph-hash" {...p} />;
        const Palette = (p) => <IconWrapper iconClass="ph-bold ph-palette" {...p} />;
        const Zap = (p) => <IconWrapper iconClass="ph-bold ph-lightning" {...p} />;
        const Globe = (p) => <IconWrapper iconClass="ph-bold ph-globe" {...p} />;
        const Briefcase = (p) => <IconWrapper iconClass="ph-bold ph-briefcase" {...p} />;
        const Clock = (p) => <IconWrapper iconClass="ph-bold ph-clock" {...p} />;
        const MapPin = (p) => <IconWrapper iconClass="ph-bold ph-map-pin" {...p} />;
        const HelpCircle = (p) => <IconWrapper iconClass="ph-bold ph-question" {...p} />;
        const Menu = (p) => <IconWrapper iconClass="ph-bold ph-list" {...p} />;
        const X = (p) => <IconWrapper iconClass="ph-bold ph-x" {...p} />;
        const PenTool = (p) => <IconWrapper iconClass="ph-bold ph-pen-nib" {...p} />;
        const FileText = (p) => <IconWrapper iconClass="ph-bold ph-file-text" {...p} />;
        const Check = (p) => <IconWrapper iconClass="ph-bold ph-check" {...p} />;
        const Star = (p) => <IconWrapper iconClass="ph-bold ph-star" {...p} />;
        const Trophy = (p) => <IconWrapper iconClass="ph-bold ph-trophy" {...p} />;
        const ArrowClockwise = (p) => <IconWrapper iconClass="ph-bold ph-arrow-clockwise" {...p} />;
        const Sliders = (p) => <IconWrapper iconClass="ph-bold ph-sliders" {...p} />;

        // --- 語音輔助 ---
        const speak = (text) => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/Set \d+ - Level \d+: /g, '').replace(/Level \d+: /g, '').replace(/\(.*?\):/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 0.9; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
              v.lang.includes('ja') || v.lang.includes('es') || v.lang.includes('it')
            );
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.saveInstance && window.speechSynthesis.saveInstance();
            window.speechSynthesis.speak(utterance);
          }
        };

        const App = () => {
          const [selectedCategory, setSelectedCategory] = useState(window.VOCAB_DATA[0]);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('learn'); // 'learn', 'all', 'quiz'
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);

          // 語言設定 ('zh' | 'en' | 'ja')
          const [lang, setLang] = useState(() => {
            try {
              return localStorage.getItem('toki_pona_lang') || 'zh';
            } catch (e) {
              return 'zh';
            }
          });

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_lang', lang);
            } catch (e) {}
          }, [lang]);

          // Sitelen Pona 象形文字開關
          const [showSitelen, setShowSitelen] = useState(() => {
            try {
              return localStorage.getItem('toki_pona_sitelen') === 'true';
            } catch (e) {
              return false;
            }
          });

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_sitelen', showSitelen);
            } catch (e) {}
          }, [showSitelen]);

          const getMeaning = (item) => {
            if (!item) return '';
            if (lang === 'en') return item.en || item.cn;
            if (lang === 'ja') return item.ja || item.cn;
            return item.cn;
          };

          // 2. 持久化學習進度 (localStorage)
          const [masteredWords, setMasteredWords] = useState(() => {
            try {
              const saved = localStorage.getItem('toki_pona_mastered');
              return saved ? JSON.parse(saved) : {};
            } catch (e) {
              return {};
            }
          });

          // 篩選狀態：'all' | 'mastered' | 'unmastered'
          const [statusFilter, setStatusFilter] = useState('all');

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_mastered', JSON.stringify(masteredWords));
            } catch (e) {}
          }, [masteredWords]);

          const toggleMastered = (wordKey, e) => {
            e.stopPropagation();
            setMasteredWords(prev => ({
              ...prev,
              [wordKey]: !prev[wordKey]
            }));
          };

          // 錯題本持久化 (localStorage)
          const [mistakes, setMistakes] = useState(() => {
            try {
              const saved = localStorage.getItem('toki_pona_mistakes');
              return saved ? JSON.parse(saved) : {};
            } catch (e) {
              return {};
            }
          });

          // 單字自訂筆記持久化 (localStorage: toki_pona_notes)
          const [notes, setNotes] = useState(() => {
            try {
              const saved = localStorage.getItem('toki_pona_notes');
              return saved ? JSON.parse(saved) : {};
            } catch (e) {
              return {};
            }
          });

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_notes', JSON.stringify(notes));
            } catch (e) {}
          }, [notes]);

          // 正在編輯筆記的單字 key
          const [editingNoteKey, setEditingNoteKey] = useState(null);
          const [noteInputText, setNoteInputText] = useState('');

          const saveNote = (wordKey, text) => {
            setNotes(prev => {
              const next = { ...prev };
              if (!text || !text.trim()) {
                delete next[wordKey];
              } else {
                next[wordKey] = text.trim();
              }
              return next;
            });
            setEditingNoteKey(null);
          };

          const notedCount = useMemo(() => {
            return Object.values(notes).filter(n => n && n.trim().length > 0).length;
          }, [notes]);

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_mistakes', JSON.stringify(mistakes));
            } catch (e) {}
          }, [mistakes]);

          const removeMistake = (wordKey, e) => {
            if (e) e.stopPropagation();
            setMistakes(prev => {
              const next = { ...prev };
              delete next[wordKey];
              return next;
            });
          };

          const clearAllMistakes = () => {
            if (window.confirm('確定要清空整本錯題本嗎？')) {
              setMistakes({});
            }
          };

          const mistakesList = useMemo(() => Object.values(mistakes), [mistakes]);

          // 計算總單字與已掌握數
          const allWordsWithKey = useMemo(() => {
            const list = [];
            window.VOCAB_DATA.forEach(cat => {
              cat.words.forEach(w => {
                const key = `${cat.id}___${w.tp}`;
                list.push({ ...w, categoryId: cat.id, categoryTitle: cat.title, key });
              });
            });
            return list;
          }, []);

          const totalWordsCount = allWordsWithKey.length;
          const masteredCount = useMemo(() => {
            return allWordsWithKey.filter(w => masteredWords[w.key]).length;
          }, [allWordsWithKey, masteredWords]);

          const masteryPercentage = totalWordsCount > 0 ? Math.round((masteredCount / totalWordsCount) * 100) : 0;

          // 根據 activeTab 與 statusFilter 過濾單字
          const filteredWords = useMemo(() => {
            let list = [];
            if (activeTab === 'learn') {
              list = selectedCategory.words.map(w => {
                const key = `${selectedCategory.id}___${w.tp}`;
                return { ...w, categoryId: selectedCategory.id, key };
              });
            } else if (activeTab === 'all') {
              list = allWordsWithKey;
              if (searchTerm) {
                const lowerTerm = searchTerm.toLowerCase();
                list = list.filter(w => 
                  w.tp.toLowerCase().includes(lowerTerm) || 
                  w.cn.includes(searchTerm) ||
                  (notes[w.key] && notes[w.key].toLowerCase().includes(lowerTerm))
                );
              }
            }

            if (statusFilter === 'mastered') {
              list = list.filter(w => masteredWords[w.key]);
            } else if (statusFilter === 'unmastered') {
              list = list.filter(w => !masteredWords[w.key]);
            } else if (statusFilter === 'noted') {
              list = list.filter(w => notes[w.key] && notes[w.key].trim().length > 0);
            }

            return list;
          }, [selectedCategory, searchTerm, activeTab, allWordsWithKey, statusFilter, masteredWords, notes]);


          // --- 3. 互動式測驗模式 (Quiz Mode) ---
          const [quizState, setQuizState] = useState('start'); // 'start' | 'playing' | 'result'
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [isAnswered, setIsAnswered] = useState(false);
          const [quizScore, setQuizScore] = useState(0);
          const [wrongQuestions, setWrongQuestions] = useState([]);
          const [selectedQuizType, setSelectedQuizType] = useState('mixed'); // 'mixed' | 'vocab' | 'listening' | 'cloze' | 'sitelen'

          // 開始新測驗
          const startQuiz = (sourceList = allWordsWithKey, mode = selectedQuizType) => {
            let questions = [];

            if (mode === 'cloze') {
              const allSentences = [];
              window.VOCAB_DATA.forEach(cat => {
                if (cat.sentences) {
                  cat.sentences.forEach(s => {
                    allSentences.push({ ...s, categoryTitle: cat.title });
                  });
                }
              });

              if (allSentences.length < 4) {
                alert('例句數量不足，無法開始克漏字測驗！');
                return;
              }

              const shuffledSents = [...allSentences].sort(() => 0.5 - Math.random());
              const chosenSents = shuffledSents.slice(0, Math.min(10, shuffledSents.length));

              questions = chosenSents.map(sent => {
                const rawTokens = sent.tp.replace(/[.,?!]/g, '').split(' ');
                const vocabTpSet = new Set(allWordsWithKey.map(w => w.tp.toLowerCase()));
                const candidateTokens = rawTokens.filter(t => vocabTpSet.has(t.toLowerCase()));
                const targetToken = candidateTokens.length > 0 
                  ? candidateTokens[Math.floor(Math.random() * candidateTokens.length)]
                  : rawTokens[0];

                const maskedTp = sent.tp.replace(new RegExp(`\\b${targetToken}\\b`, 'i'), '_____');

                const otherWords = allWordsWithKey.filter(w => w.tp.toLowerCase() !== targetToken.toLowerCase());
                const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random());
                const wrongOptions = shuffledOthers.slice(0, 3).map(w => w.tp);
                const options = [targetToken, ...wrongOptions].sort(() => 0.5 - Math.random());

                return {
                  type: 'cloze',
                  questionText: maskedTp,
                  correctAnswer: targetToken,
                  options,
                  sentenceCn: sent.cn,
                  originalTp: sent.tp,
                  item: { tp: targetToken, cn: sent.cn, type: '例句克漏字' }
                };
              });
            } else {
              if (!sourceList || sourceList.length < 4) {
                alert('單字數量不足，無法開始測驗！');
                return;
              }
              const shuffled = [...sourceList].sort(() => 0.5 - Math.random());
              const selectedCount = Math.min(10, shuffled.length);
              const chosen = shuffled.slice(0, selectedCount);

              questions = chosen.map(item => {
                let qType = mode;
                if (mode === 'mixed') {
                  const types = ['tp_to_cn', 'cn_to_tp', 'listening', 'sitelen_to_tp', 'cn_to_sitelen', 'listening_to_sitelen'];
                  qType = types[Math.floor(Math.random() * types.length)];
                } else if (mode === 'sitelen') {
                  const types = ['sitelen_to_tp', 'cn_to_sitelen', 'listening_to_sitelen'];
                  qType = types[Math.floor(Math.random() * types.length)];
                }

                let direction = 'tp_to_cn';
                if (qType === 'cn_to_tp') direction = 'cn_to_tp';
                if (qType === 'listening') direction = 'listening';
                if (qType === 'sitelen_to_tp') direction = 'sitelen_to_tp';
                if (qType === 'cn_to_sitelen') direction = 'cn_to_sitelen';
                if (qType === 'listening_to_sitelen') direction = 'listening_to_sitelen';

                const pureTp = item.tp.replace(/\s*\(.*?\)/, '').toLowerCase();
                const itemMeaning = getMeaning(item);

                let correctAnswer = itemMeaning;
                if (direction === 'cn_to_tp' || direction === 'listening' || direction === 'sitelen_to_tp') {
                  correctAnswer = item.tp;
                } else if (direction === 'cn_to_sitelen' || direction === 'listening_to_sitelen') {
                  correctAnswer = pureTp;
                }
                
                const otherItems = allWordsWithKey.filter(w => w.tp !== item.tp);
                const shuffledOthers = [...otherItems].sort(() => 0.5 - Math.random());
                const wrongOptions = shuffledOthers.slice(0, 3).map(w => {
                  if (direction === 'cn_to_tp' || direction === 'listening' || direction === 'sitelen_to_tp') {
                    return w.tp;
                  }
                  if (direction === 'cn_to_sitelen' || direction === 'listening_to_sitelen') {
                    return w.tp.replace(/\s*\(.*?\)/, '').toLowerCase();
                  }
                  return getMeaning(w);
                });
                const options = [correctAnswer, ...wrongOptions].sort(() => 0.5 - Math.random());

                let questionText = item.tp;
                if (direction === 'cn_to_tp' || direction === 'cn_to_sitelen') {
                  questionText = itemMeaning;
                } else if (direction === 'sitelen_to_tp') {
                  questionText = pureTp;
                }

                return {
                  type: direction,
                  questionText,
                  correctAnswer,
                  options,
                  item
                };
              });
            }

            setQuizQuestions(questions);
            setCurrentQuizIndex(0);
            setSelectedOption(null);
            setIsAnswered(false);
            setQuizScore(0);
            setWrongQuestions([]);
            setQuizState('playing');

            if (questions.length > 0 && (questions[0].type === 'listening' || questions[0].type === 'listening_to_sitelen')) {
              setTimeout(() => speak(questions[0].item.tp), 500);
            }
          };

          const handleAnswerSelect = (option) => {
            if (isAnswered) return;
            setSelectedOption(option);
            setIsAnswered(true);

            const currentQ = quizQuestions[currentQuizIndex];
            const isCorrect = option === currentQ.correctAnswer;
            if (isCorrect) {
              setQuizScore(prev => prev + 1);
            } else {
              setWrongQuestions(prev => [...prev, currentQ]);
              if (currentQ.item && currentQ.item.tp) {
                const wordKey = currentQ.item.key || currentQ.item.tp;
                setMistakes(prev => ({
                  ...prev,
                  [wordKey]: {
                    key: wordKey,
                    tp: currentQ.item.tp,
                    cn: currentQ.item.cn || currentQ.correctAnswer,
                    type: currentQ.item.type || '測驗錯題',
                    count: (prev[wordKey]?.count || 0) + 1,
                    lastWrong: Date.now()
                  }
                }));
              }
            }
          };

          const handleNextQuestion = () => {
            if (currentQuizIndex + 1 < quizQuestions.length) {
              const nextIdx = currentQuizIndex + 1;
              setCurrentQuizIndex(nextIdx);
              setSelectedOption(null);
              setIsAnswered(false);

              if (quizQuestions[nextIdx].type === 'listening' || quizQuestions[nextIdx].type === 'listening_to_sitelen') {
                setTimeout(() => speak(quizQuestions[nextIdx].item.tp), 400);
              }
            } else {
              setQuizState('result');
            }
          };


          return (
            <div className="flex h-screen text-[#2c2825] font-sans overflow-hidden" style={{backgroundColor: '#faf9f7'}}>
              
              {/* Mobile Sidebar Toggle */}
              <div className={`fixed inset-0 bg-black/30 z-20 md:hidden transition-opacity ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} 
                   onClick={() => setIsSidebarOpen(false)} />

              {/* Sidebar Navigation */}
              <aside className={`
                absolute md:relative z-30 w-72 flex flex-col h-full transition-transform duration-300
                ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
              `} style={{backgroundColor: '#f0ede8', borderRight: '1px solid #e0dbd3'}}>
                <div className="p-6 flex justify-between items-center" style={{borderBottom: "1px solid #e0dbd3", backgroundColor: "#f0ede8"}}>
                  <div>
                    <h1 className="text-2xl font-bold text-[#2c2825] tracking-wider flex items-center gap-2">
                      <Book className="text-[#8a9ba8]" />
                      TOKI PONA
                    </h1>
                    <p className="text-xs mt-1 uppercase tracking-widest" style={{color: "#9e9590"}}>留白習字 · 簡約之語</p>
                  </div>
                  <button onClick={() => setIsSidebarOpen(false)} className="md:hidden hover:opacity-70" style={{color: "#9e9590"}}>
                    <X size={24} />
                  </button>
                </div>

                {/* 學習進度摘要卡片 */}
                <div className="px-6 py-4" style={{backgroundColor: "#ece8e2", borderBottom: "1px solid #e0dbd3"}}>
                  <div className="flex justify-between text-xs font-bold mb-1.5" style={{color: "#6b6460"}}>
                    <span>學習進度掌握</span>
                    <span className="font-bold" style={{color: "#8a9ba8"}}>{masteredCount} / {totalWordsCount} 詞 ({masteryPercentage}%)</span>
                  </div>
                  <div className="w-full h-2 rounded-full overflow-hidden" style={{backgroundColor: "#e0dbd3"}}>
                    <div className="h-full transition-all duration-500" style={{backgroundColor: "#8a9ba8", width: `${masteryPercentage}%`}}></div>
                  </div>
                </div>

                <nav className="flex-1 overflow-y-auto py-4 space-y-1 custom-scrollbar" style={{backgroundColor: "#f0ede8"}}>
                  <div className="px-6 mb-2 text-xs font-bold uppercase tracking-wider" style={{color: "#9e9590", letterSpacing: "0.12em"}}>章節導航</div>
                  {window.VOCAB_DATA.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => {
                        setSelectedCategory(cat);
                        setActiveTab('learn');
                        setSearchTerm('');
                        if (window.innerWidth < 768) setIsSidebarOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all
                        ${selectedCategory.id === cat.id && activeTab === 'learn'

                            {wrongQuestions.length > 0 && (
                              <div className="mt-8 pt-6 text-left" style={{borderTop: "1px solid #e0dbd3"}}>
                                <h4 className="font-bold text-sm mb-3" style={{color: "#2c2825"}}>本次錯題檢討：</h4>
                                <div className="space-y-2 max-h-60 overflow-y-auto pr-1">
                                  {wrongQuestions.map((wq, wIdx) => {
                                    const tpWord = wq.item?.tp || wq.correctAnswer;
                                    const pureTp = (tpWord || '').replace(/\s*\(.*?\)/, '').toLowerCase();
                                    return (
                                      <div key={wIdx} className="p-3 rounded-xl flex items-center justify-between text-xs" style={{backgroundColor: "#faf5f6", border: "1px solid #e8d0d4"}}>
                                        <div className="flex items-center gap-2.5">
                                          <span className="sitelen-pona text-2xl leading-none select-none" style={{color: "#b09070"}}>{pureTp}</span>
                                          <div>
                                            <span className="font-bold font-serif mr-1.5" style={{color: "#2c2825"}}>{tpWord}</span>
                                            <span className="" style={{color: "#6b6460"}}>{getMeaning(wq.item)}</span>
                                          </div>
                                        </div>
                                        <span className="font-semibold font-mono" style={{color: "#b08088"}}>
                                          {(wq.type === 'cn_to_sitelen' || wq.type === 'listening_to_sitelen') ? (
                                            <span className="sitelen-pona text-xl" style={{color: "#b09070"}}>{wq.correctAnswer}</span>
                                          ) : (
                                            `正解: ${wq.correctAnswer}`
                                          )}
                                        </span>
                                      </div>
                                    );
                                  })}
                                </div>
                              </div>
                            )}
                          </div>
                        )}

                      </div>
                    )}

                  </div>
                </div>
              
                {/* ==================== 行動端底部導航列 (Mobile Bottom Nav) ==================== */}
                <nav className="md:hidden flex items-center justify-around h-16 border-t z-20 flex-shrink-0 select-none shadow-[0_-2px_10px_rgba(44,40,37,0.04)]" style={{backgroundColor: '#f0ede8', borderColor: '#e0dbd3'}}>
                  {/* 1. 學習 (Learn) */}
                  <button
                    onClick={() => {
                      setActiveTab('learn');
                      if (!selectedCategory) setSelectedCategory(window.VOCAB_DATA[0]);
                    }}
                    className={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                      activeTab === 'learn' ? 'text-[#2c2825] font-bold' : 'text-[#9e9590] hover:text-[#6b6460]'
                    }`}
                  >
                    <div className={`p-1 rounded-lg transition-all ${activeTab === 'learn' ? 'bg-[#faf9f7] shadow-sm' : ''}`}>
                      <Book size={18} className={activeTab === 'learn' ? 'text-[#8a9ba8]' : 'text-[#9e9590]'} />
                    </div>
                    <span className="text-[10px] mt-0.5 tracking-wider">學習</span>
                  </button>

                  {/* 2. 全詞彙字典 (Dictionary) */}
                  <button
                    onClick={() => {
                      setActiveTab('all');
                    }}
                    className={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                      activeTab === 'all' ? 'text-[#2c2825] font-bold' : 'text-[#9e9590] hover:text-[#6b6460]'
                    }`}
                  >
                    <div className={`p-1 rounded-lg transition-all ${activeTab === 'all' ? 'bg-[#faf9f7] shadow-sm' : ''}`}>
                      <Search size={18} className={activeTab === 'all' ? 'text-[#8a9ba8]' : 'text-[#9e9590]'} />
                    </div>
                    <span className="text-[10px] mt-0.5 tracking-wider">字典</span>
                  </button>

                  {/* 3. 隨堂測驗 (Quiz) */}
                  <button
                    onClick={() => {
                      setActiveTab('quiz');
                      setQuizState('start');
                    }}
                    className={`flex flex-col items-center justify-center flex-1 py-1 transition-all ${
                      activeTab === 'quiz' ? 'text-[#2c2825] font-bold' : 'text-[#9e9590] hover:text-[#6b6460]'
                    }`}
                  >
                    <div className={`p-1 rounded-lg transition-all ${activeTab === 'quiz' ? 'bg-[#faf9f7] shadow-sm' : ''}`}>
                      <Zap size={18} className={activeTab === 'quiz' ? 'text-[#b09070]' : 'text-[#9e9590]'} />
                    </div>
                    <span className="text-[10px] mt-0.5 tracking-wider">測驗</span>
                  </button>

                  {/* 4. 設定與章節選單 (Menu / Settings) */}
                  <button
                    onClick={() => setIsSidebarOpen(true)}
                    className="flex flex-col items-center justify-center flex-1 py-1 text-[#9e9590] hover:text-[#6b6460] transition-all"
                  >
                    <div className="p-1 rounded-lg">
                      <Sliders size={18} className="text-[#9e9590]" />
                    </div>
                    <span className="text-[10px] mt-0.5 tracking-wider">設定</span>
                  </button>
                </nav>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('ServiceWorker registration successful: ', reg.scope))
              .catch(err => console.log('ServiceWorker registration failed: ', err));
          });
        }
    </script>
</body>
</html>
