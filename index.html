<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toki Pona Mastery - 從零開始學到會</title>
    
    <!-- 1. 引入 Tailwind CSS (樣式) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. 引入 React 核心 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- 3. 引入 Babel (翻譯機) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 4. 引入 Phosphor Icons (圖示庫) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- 5. 引入 抽離的 VOCAB_DATA 資料 -->
    <script src="./data.js"></script>

    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="TokiPona">
    <link rel="apple-touch-icon" href="./icon.svg">

    <style>
        @font-face {
            font-family: 'linja-pona';
            src: url('./linja-pona.otf') format('opentype');
            font-display: swap;
        }
        .sitelen-pona {
            font-family: 'linja-pona', sans-serif;
            font-feature-settings: "liga" 1, "clig" 1, "calt" 1, "kern" 1, "mark" 1;
            text-rendering: optimizeLegibility;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- 圖示組件封裝 ---
        const IconWrapper = ({ iconClass, size = 20, className = "" }) => (
            <i className={`${iconClass} ${className}`} style={{ fontSize: size, verticalAlign: 'middle', display: 'inline-block' }}></i>
        );

        // --- 圖示對應表與輔助函式 ---
        const ICONS_MAP = {
          Book: (p) => <IconWrapper iconClass="ph-bold ph-book" {...p} />,
          Users: (p) => <IconWrapper iconClass="ph-bold ph-users" {...p} />,
          Layers: (p) => <IconWrapper iconClass="ph-bold ph-stack" {...p} />,
          Clock: (p) => <IconWrapper iconClass="ph-bold ph-clock" {...p} />,
          Briefcase: (p) => <IconWrapper iconClass="ph-bold ph-briefcase" {...p} />,
          Activity: (p) => <IconWrapper iconClass="ph-bold ph-activity" {...p} />,
          Home: (p) => <IconWrapper iconClass="ph-bold ph-house" {...p} />,
          Globe: (p) => <IconWrapper iconClass="ph-bold ph-globe" {...p} />,
          Feather: (p) => <IconWrapper iconClass="ph-bold ph-feather" {...p} />,
          Palette: (p) => <IconWrapper iconClass="ph-bold ph-palette" {...p} />,
          Zap: (p) => <IconWrapper iconClass="ph-bold ph-lightning" {...p} />,
          PenTool: (p) => <IconWrapper iconClass="ph-bold ph-pen-nib" {...p} />,
          FileText: (p) => <IconWrapper iconClass="ph-bold ph-file-text" {...p} />,
          MessageSquare: (p) => <IconWrapper iconClass="ph-bold ph-chat-circle" {...p} />
        };

        const renderIcon = (iconKey, size = 20) => {
          const IconComponent = ICONS_MAP[iconKey] || ICONS_MAP.Book;
          return <IconComponent size={size} />;
        };

        const Book = (p) => <IconWrapper iconClass="ph-bold ph-book" {...p} />;
        const MessageSquare = (p) => <IconWrapper iconClass="ph-bold ph-chat-circle" {...p} />;
        const Feather = (p) => <IconWrapper iconClass="ph-bold ph-feather" {...p} />;
        const Sun = (p) => <IconWrapper iconClass="ph-bold ph-sun" {...p} />;
        const Home = (p) => <IconWrapper iconClass="ph-bold ph-house" {...p} />;
        const Users = (p) => <IconWrapper iconClass="ph-bold ph-users" {...p} />;
        const Activity = (p) => <IconWrapper iconClass="ph-bold ph-activity" {...p} />;
        const Layers = (p) => <IconWrapper iconClass="ph-bold ph-stack" {...p} />;
        const Volume2 = (p) => <IconWrapper iconClass="ph-bold ph-speaker-high" {...p} />;
        const Search = (p) => <IconWrapper iconClass="ph-bold ph-magnifying-glass" {...p} />;
        const ChevronRight = (p) => <IconWrapper iconClass="ph-bold ph-caret-right" {...p} />;
        const Hash = (p) => <IconWrapper iconClass="ph-bold ph-hash" {...p} />;
        const Palette = (p) => <IconWrapper iconClass="ph-bold ph-palette" {...p} />;
        const Zap = (p) => <IconWrapper iconClass="ph-bold ph-lightning" {...p} />;
        const Globe = (p) => <IconWrapper iconClass="ph-bold ph-globe" {...p} />;
        const Briefcase = (p) => <IconWrapper iconClass="ph-bold ph-briefcase" {...p} />;
        const Clock = (p) => <IconWrapper iconClass="ph-bold ph-clock" {...p} />;
        const MapPin = (p) => <IconWrapper iconClass="ph-bold ph-map-pin" {...p} />;
        const HelpCircle = (p) => <IconWrapper iconClass="ph-bold ph-question" {...p} />;
        const Menu = (p) => <IconWrapper iconClass="ph-bold ph-list" {...p} />;
        const X = (p) => <IconWrapper iconClass="ph-bold ph-x" {...p} />;
        const PenTool = (p) => <IconWrapper iconClass="ph-bold ph-pen-nib" {...p} />;
        const FileText = (p) => <IconWrapper iconClass="ph-bold ph-file-text" {...p} />;
        const Check = (p) => <IconWrapper iconClass="ph-bold ph-check" {...p} />;
        const Star = (p) => <IconWrapper iconClass="ph-bold ph-star" {...p} />;
        const Trophy = (p) => <IconWrapper iconClass="ph-bold ph-trophy" {...p} />;
        const ArrowClockwise = (p) => <IconWrapper iconClass="ph-bold ph-arrow-clockwise" {...p} />;
        const Sliders = (p) => <IconWrapper iconClass="ph-bold ph-sliders" {...p} />;

        // --- 語音輔助 ---
        const speak = (text) => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/Set \d+ - Level \d+: /g, '').replace(/Level \d+: /g, '').replace(/\(.*?\):/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 0.9; 
            utterance.pitch = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => 
              v.lang.includes('ja') || v.lang.includes('es') || v.lang.includes('it')
            );
            if (preferredVoice) utterance.voice = preferredVoice;
            window.speechSynthesis.saveInstance && window.speechSynthesis.saveInstance();
            window.speechSynthesis.speak(utterance);
          }
        };

        const App = () => {
          const [selectedCategory, setSelectedCategory] = useState(window.VOCAB_DATA[0]);
          const [searchTerm, setSearchTerm] = useState('');
          const [activeTab, setActiveTab] = useState('learn'); // 'learn', 'all', 'quiz'
          const [isSidebarOpen, setIsSidebarOpen] = useState(true);

          // 語言設定 ('zh' | 'en' | 'ja')
          const [lang, setLang] = useState(() => {
            try {
              return localStorage.getItem('toki_pona_lang') || 'zh';
            } catch (e) {
              return 'zh';
            }
          });

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_lang', lang);
            } catch (e) {}
          }, [lang]);

          // Sitelen Pona 象形文字開關
          const [showSitelen, setShowSitelen] = useState(() => {
            try {
              return localStorage.getItem('toki_pona_sitelen') === 'true';
            } catch (e) {
              return false;
            }
          });

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_sitelen', showSitelen);
            } catch (e) {}
          }, [showSitelen]);

          const getMeaning = (item) => {
            if (!item) return '';
            if (lang === 'en') return item.en || item.cn;
            if (lang === 'ja') return item.ja || item.cn;
            return item.cn;
          };

          // 2. 持久化學習進度 (localStorage)
          const [masteredWords, setMasteredWords] = useState(() => {
            try {
              const saved = localStorage.getItem('toki_pona_mastered');
              return saved ? JSON.parse(saved) : {};
            } catch (e) {
              return {};
            }
          });

          // 篩選狀態：'all' | 'mastered' | 'unmastered'
          const [statusFilter, setStatusFilter] = useState('all');

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_mastered', JSON.stringify(masteredWords));
            } catch (e) {}
          }, [masteredWords]);

          const toggleMastered = (wordKey, e) => {
            e.stopPropagation();
            setMasteredWords(prev => ({
              ...prev,
              [wordKey]: !prev[wordKey]
            }));
          };

          // 錯題本持久化 (localStorage)
          const [mistakes, setMistakes] = useState(() => {
            try {
              const saved = localStorage.getItem('toki_pona_mistakes');
              return saved ? JSON.parse(saved) : {};
            } catch (e) {
              return {};
            }
          });

          useEffect(() => {
            try {
              localStorage.setItem('toki_pona_mistakes', JSON.stringify(mistakes));
            } catch (e) {}
          }, [mistakes]);

          const removeMistake = (wordKey, e) => {
            if (e) e.stopPropagation();
            setMistakes(prev => {
              const next = { ...prev };
              delete next[wordKey];
              return next;
            });
          };

          const clearAllMistakes = () => {
            if (window.confirm('確定要清空整本錯題本嗎？')) {
              setMistakes({});
            }
          };

          const mistakesList = useMemo(() => Object.values(mistakes), [mistakes]);

          // 計算總單字與已掌握數
          const allWordsWithKey = useMemo(() => {
            const list = [];
            window.VOCAB_DATA.forEach(cat => {
              cat.words.forEach(w => {
                const key = `${cat.id}___${w.tp}`;
                list.push({ ...w, categoryId: cat.id, categoryTitle: cat.title, key });
              });
            });
            return list;
          }, []);

          const totalWordsCount = allWordsWithKey.length;
          const masteredCount = useMemo(() => {
            return allWordsWithKey.filter(w => masteredWords[w.key]).length;
          }, [allWordsWithKey, masteredWords]);

          const masteryPercentage = totalWordsCount > 0 ? Math.round((masteredCount / totalWordsCount) * 100) : 0;

          // 根據 activeTab 與 statusFilter 過濾單字
          const filteredWords = useMemo(() => {
            let list = [];
            if (activeTab === 'learn') {
              list = selectedCategory.words.map(w => {
                const key = `${selectedCategory.id}___${w.tp}`;
                return { ...w, categoryId: selectedCategory.id, key };
              });
            } else if (activeTab === 'all') {
              list = allWordsWithKey;
              if (searchTerm) {
                list = list.filter(w => 
                  w.tp.toLowerCase().includes(searchTerm.toLowerCase()) || 
                  w.cn.includes(searchTerm)
                );
              }
            }

            if (statusFilter === 'mastered') {
              list = list.filter(w => masteredWords[w.key]);
            } else if (statusFilter === 'unmastered') {
              list = list.filter(w => !masteredWords[w.key]);
            }

            return list;
          }, [selectedCategory, searchTerm, activeTab, allWordsWithKey, statusFilter, masteredWords]);


          // --- 3. 互動式測驗模式 (Quiz Mode) ---
          const [quizState, setQuizState] = useState('start'); // 'start' | 'playing' | 'result'
          const [quizQuestions, setQuizQuestions] = useState([]);
          const [currentQuizIndex, setCurrentQuizIndex] = useState(0);
          const [selectedOption, setSelectedOption] = useState(null);
          const [isAnswered, setIsAnswered] = useState(false);
          const [quizScore, setQuizScore] = useState(0);
          const [wrongQuestions, setWrongQuestions] = useState([]);
          const [selectedQuizType, setSelectedQuizType] = useState('mixed'); // 'mixed' | 'vocab' | 'listening' | 'cloze'

          // 開始新測驗
          const startQuiz = (sourceList = allWordsWithKey, mode = selectedQuizType) => {
            let questions = [];

            if (mode === 'cloze') {
              const allSentences = [];
              window.VOCAB_DATA.forEach(cat => {
                if (cat.sentences) {
                  cat.sentences.forEach(s => {
                    allSentences.push({ ...s, categoryTitle: cat.title });
                  });
                }
              });

              if (allSentences.length < 4) {
                alert('例句數量不足，無法開始克漏字測驗！');
                return;
              }

              const shuffledSents = [...allSentences].sort(() => 0.5 - Math.random());
              const chosenSents = shuffledSents.slice(0, Math.min(10, shuffledSents.length));

              questions = chosenSents.map(sent => {
                const rawTokens = sent.tp.replace(/[.,?!]/g, '').split(' ');
                const vocabTpSet = new Set(allWordsWithKey.map(w => w.tp.toLowerCase()));
                const candidateTokens = rawTokens.filter(t => vocabTpSet.has(t.toLowerCase()));
                const targetToken = candidateTokens.length > 0 
                  ? candidateTokens[Math.floor(Math.random() * candidateTokens.length)]
                  : rawTokens[0];

                const maskedTp = sent.tp.replace(new RegExp(`\\b${targetToken}\\b`, 'i'), '_____');

                const otherWords = allWordsWithKey.filter(w => w.tp.toLowerCase() !== targetToken.toLowerCase());
                const shuffledOthers = [...otherWords].sort(() => 0.5 - Math.random());
                const wrongOptions = shuffledOthers.slice(0, 3).map(w => w.tp);
                const options = [targetToken, ...wrongOptions].sort(() => 0.5 - Math.random());

                return {
                  type: 'cloze',
                  questionText: maskedTp,
                  correctAnswer: targetToken,
                  options,
                  sentenceCn: sent.cn,
                  originalTp: sent.tp,
                  item: { tp: targetToken, cn: sent.cn, type: '例句克漏字' }
                };
              });
            } else {
              if (!sourceList || sourceList.length < 4) {
                alert('單字數量不足，無法開始測驗！');
                return;
              }
              const shuffled = [...sourceList].sort(() => 0.5 - Math.random());
              const selectedCount = Math.min(10, shuffled.length);
              const chosen = shuffled.slice(0, selectedCount);

              questions = chosen.map(item => {
                let qType = mode;
                if (mode === 'mixed') {
                  const types = ['tp_to_cn', 'cn_to_tp', 'listening'];
                  qType = types[Math.floor(Math.random() * types.length)];
                }

                let direction = 'tp_to_cn';
                if (qType === 'cn_to_tp') direction = 'cn_to_tp';
                if (qType === 'listening') direction = 'listening';

                const correctAnswer = (direction === 'cn_to_tp' || direction === 'listening') ? item.tp : item.cn;
                
                const otherItems = allWordsWithKey.filter(w => w.tp !== item.tp);
                const shuffledOthers = [...otherItems].sort(() => 0.5 - Math.random());
                const wrongOptions = shuffledOthers.slice(0, 3).map(w => (direction === 'cn_to_tp' || direction === 'listening') ? w.tp : w.cn);
                const options = [correctAnswer, ...wrongOptions].sort(() => 0.5 - Math.random());

                return {
                  type: direction,
                  questionText: direction === 'cn_to_tp' ? item.cn : item.tp,
                  correctAnswer,
                  options,
                  item
                };
              });
            }

            setQuizQuestions(questions);
            setCurrentQuizIndex(0);
            setSelectedOption(null);
            setIsAnswered(false);
            setQuizScore(0);
            setWrongQuestions([]);
            setQuizState('playing');

            if (questions.length > 0 && questions[0].type === 'listening') {
              setTimeout(() => speak(questions[0].item.tp), 500);
            }
          };

          const handleAnswerSelect = (option) => {
            if (isAnswered) return;
            setSelectedOption(option);
            setIsAnswered(true);

            const currentQ = quizQuestions[currentQuizIndex];
            const isCorrect = option === currentQ.correctAnswer;
            if (isCorrect) {
              setQuizScore(prev => prev + 1);
            } else {
              setWrongQuestions(prev => [...prev, currentQ]);
              if (currentQ.item && currentQ.item.tp) {
                const wordKey = currentQ.item.key || currentQ.item.tp;
                setMistakes(prev => ({
                  ...prev,
                  [wordKey]: {
                    key: wordKey,
                    tp: currentQ.item.tp,
                    cn: currentQ.item.cn || currentQ.correctAnswer,
                    type: currentQ.item.type || '測驗錯題',
                    count: (prev[wordKey]?.count || 0) + 1,
                    lastWrong: Date.now()
                  }
                }));
              }
            }
          };

          const handleNextQuestion = () => {
            if (currentQuizIndex + 1 < quizQuestions.length) {
              const nextIdx = currentQuizIndex + 1;
              setCurrentQuizIndex(nextIdx);
              setSelectedOption(null);
              setIsAnswered(false);

              if (quizQuestions[nextIdx].type === 'listening') {
                setTimeout(() => speak(quizQuestions[nextIdx].item.tp), 400);
              }
            } else {
              setQuizState('result');
            }
          };


          return (
            <div className="flex h-screen bg-slate-50 text-slate-900 font-sans overflow-hidden">
              
              {/* Mobile Sidebar Toggle */}
              <div className={`fixed inset-0 bg-black/50 z-20 md:hidden transition-opacity ${isSidebarOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} 
                   onClick={() => setIsSidebarOpen(false)} />

              {/* Sidebar Navigation */}
              <aside className={`
                absolute md:relative z-30 w-72 bg-slate-900 text-slate-300 flex flex-col shadow-2xl h-full transition-transform duration-300
                ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
              `}>
                <div className="p-6 border-b border-slate-800 flex justify-between items-center">
                  <div>
                    <h1 className="text-2xl font-bold text-white tracking-wider flex items-center gap-2">
                      <Book className="text-indigo-400" />
                      TOKI PONA
                    </h1>
                    <p className="text-xs text-slate-500 mt-1 uppercase tracking-widest">Mastery Edition</p>
                  </div>
                  <button onClick={() => setIsSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-white">
                    <X size={24} />
                  </button>
                </div>

                {/* 學習進度摘要卡片 */}
                <div className="px-6 py-4 bg-slate-950 border-b border-slate-800">
                  <div className="flex justify-between text-xs font-bold text-slate-400 mb-1.5">
                    <span>學習進度掌握</span>
                    <span className="text-indigo-400">{masteredCount} / {totalWordsCount} 詞 ({masteryPercentage}%)</span>
                  </div>
                  <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                    <div className="bg-indigo-500 h-full transition-all duration-500" style={{ width: `${masteryPercentage}%` }}></div>
                  </div>
                </div>

                <nav className="flex-1 overflow-y-auto py-4 space-y-1 custom-scrollbar">
                  <div className="px-6 mb-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Learning Modules</div>
                  {window.VOCAB_DATA.map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => {
                        setSelectedCategory(cat);
                        setActiveTab('learn');
                        setSearchTerm('');
                        if (window.innerWidth < 768) setIsSidebarOpen(false);
                      }}
                      className={`w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-all
                        ${selectedCategory.id === cat.id && activeTab === 'learn'
                          ? 'bg-indigo-600 text-white border-r-4 border-indigo-300 shadow-inner' 
                          : 'hover:bg-slate-800 hover:text-white'}
                      `}
                    >
                      <span className={selectedCategory.id === cat.id && activeTab === 'learn' ? 'text-white' : 'text-slate-500'}>
                        {renderIcon(cat.icon)}
                      </span>
                      <span className="truncate">{cat.title.split('(')[0]}</span>
                    </button>
                  ))}
                  
                  <div className="mt-6 px-6 mb-2 text-xs font-bold text-slate-500 uppercase tracking-wider">Tools & Practice</div>
                  <button
                     onClick={() => {
                       setActiveTab('all');
                       if (window.innerWidth < 768) setIsSidebarOpen(false);
                     }}
                     className={`w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-colors
                        ${activeTab === 'all'
                          ? 'bg-slate-700 text-white border-r-4 border-slate-400' 
                          : 'hover:bg-slate-800 hover:text-white'}
                      `}
                  >
                    <Search size={20} className={activeTab === 'all' ? 'text-white' : 'text-slate-500'} />
                    <span>全詞彙字典 (Dictionary)</span>
                  </button>

                  <button
                     onClick={() => {
                       setActiveTab('quiz');
                       setQuizState('start');
                       if (window.innerWidth < 768) setIsSidebarOpen(false);
                     }}
                     className={`w-full flex items-center gap-3 px-6 py-3 text-sm font-medium transition-colors
                        ${activeTab === 'quiz'
                          ? 'bg-purple-600 text-white border-r-4 border-purple-300' 
                          : 'hover:bg-slate-800 hover:text-white'}
                      `}
                  >
                    <Zap size={20} className={activeTab === 'quiz' ? 'text-white' : 'text-purple-400'} />
                    <span>隨堂測驗 (Quiz Mode)</span>
                  </button>
                </nav>

                {/* 顯示與語言設定 (Sidebar Settings) */}
                <div className="p-4 border-t border-slate-800 bg-slate-900 text-xs flex-shrink-0">
                  <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-3 flex items-center gap-1.5">
                    <Sliders size={14} className="text-slate-400" />
                    <span>偏好與顯示設定</span>
                  </div>

                  {/* Sitelen Pona Toggle */}
                  <div className="mb-3 bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <span className="sitelen-pona text-2xl text-amber-400 leading-none select-none flex-shrink-0">toki</span>
                      <div className="min-w-0">
                        <div className="font-bold text-slate-200 text-xs truncate">Sitelen Pona</div>
                        <div className="text-[10px] text-slate-400">象形文字顯示</div>
                      </div>
                    </div>
                    <button
                      onClick={() => setShowSitelen(prev => !prev)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 flex-shrink-0 ${
                        showSitelen 
                          ? 'bg-amber-500 text-slate-950 shadow-md ring-2 ring-amber-400/40' 
                          : 'bg-slate-800 text-slate-400 hover:text-white hover:bg-slate-700'
                      }`}
                      title={showSitelen ? '點擊關閉象形文字' : '點擊開啟象形文字'}
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${showSitelen ? 'bg-slate-950' : 'bg-slate-500'}`}></span>
                      <span>{showSitelen ? '已開啟' : '已關閉'}</span>
                    </button>
                  </div>

                  {/* Language Selector */}
                  <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <div className="flex items-center justify-between mb-2">
                      <span className="font-bold text-slate-300 text-xs flex items-center gap-1.5">
                        <Globe size={13} className="text-indigo-400" />
                        釋義語言

                                  得分: {quizScore}
                                </span>
                              </div>

                              <div className="w-full bg-slate-100 h-2 rounded-full mb-8 overflow-hidden">
                                <div className="bg-purple-600 h-full transition-all duration-300" style={{ width: `${progressPercent}%` }}></div>
                              </div>

                              {/* Question Card */}
                              <div className="text-center mb-8">
                                <span className="text-xs font-bold text-slate-400 uppercase tracking-widest block mb-2">
                                  {currentQ.type === 'tp_to_cn' && '請選擇正確的中文意思：'}
                                  {currentQ.type === 'cn_to_tp' && '請選擇正確的 Toki Pona 單字：'}
                                  {currentQ.type === 'listening' && '請聆聽發音，選出對應的 Toki Pona 單字：'}
                                  {currentQ.type === 'cloze' && '例句克漏字填空：選出填入 _____ 的正確單字'}
                                </span>

                                {currentQ.type === 'listening' ? (
                                  <div className="py-6">
                                    <button
                                      onClick={() => speak(currentQ.item.tp)}
                                      className="w-24 h-24 bg-purple-600 hover:bg-purple-700 text-white rounded-full flex items-center justify-center mx-auto shadow-xl transition-all hover:scale-105 active:scale-95 group"
                                      title="點擊播放語音"
                                    >
                                      <Volume2 size={40} className="group-hover:animate-pulse" />
                                    </button>
                                    <p className="text-xs text-purple-600 font-medium mt-4">點擊按鈕重複聆聽發音</p>
                                  </div>
                                ) : currentQ.type === 'cloze' ? (
                                  <div className="mb-4">
                                    <h3 className="text-2xl md:text-3xl font-bold text-slate-800 font-serif mb-2 tracking-wide text-purple-700">
                                      {currentQ.questionText}
                                    </h3>
                                    <p className="text-sm text-slate-500 bg-slate-100 py-1.5 px-4 rounded-full inline-block">
                                      中文釋義：{currentQ.sentenceCn}
                                    </p>
                                  </div>
                                ) : (
                                  <div>
                                    <h3 className="text-3xl md:text-4xl font-bold text-slate-800 font-serif mb-3">
                                      {currentQ.questionText}
                                    </h3>
                                    {currentQ.type === 'tp_to_cn' && (
                                      <button 
                                        onClick={() => speak(currentQ.questionText)}
                                        className="inline-flex items-center gap-1.5 text-xs text-purple-600 bg-purple-50 hover:bg-purple-100 px-3 py-1 rounded-full transition-colors font-medium"
                                      >
                                        <Volume2 size={14} /> 聽取發音
                                      </button>
                                    )}
                                  </div>
                                )}
                              </div>

                              {/* Options Grid */}
                              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                                {currentQ.options.map((option, idx) => {
                                  let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100 hover:border-slate-300";
                                  if (isAnswered) {
                                    if (option === currentQ.correctAnswer) {
                                      btnStyle = "bg-emerald-500 text-white border-emerald-600 shadow-md";
                                    } else if (option === selectedOption) {
                                      btnStyle = "bg-rose-500 text-white border-rose-600 shadow-md";
                                    } else {
                                      btnStyle = "bg-slate-50 text-slate-400 border-slate-200 opacity-60";
                                    }
                                  }

                                  return (
                                    <button
                                      key={idx}
                                      onClick={() => handleAnswerSelect(option)}
                                      disabled={isAnswered}
                                      className={`p-4 rounded-xl border-2 font-medium text-lg transition-all text-center flex items-center justify-center ${btnStyle}`}
                                    >
                                      <span>{option}</span>
                                    </button>
                                  );
                                })}
                              </div>

                              {/* Feedback & Next Button */}
                              {isAnswered && (
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 animate-fadeIn">
                                  <div>
                                    <div className="flex items-center gap-2 mb-1">
                                      {selectedOption === currentQ.correctAnswer ? (
                                        <span className="text-emerald-600 font-bold flex items-center gap-1">
                                          <Check size={18} /> 答對了！ Pona!
                                        </span>
                                      ) : (
                                        <span className="text-rose-600 font-bold flex items-center gap-1">
                                          <X size={18} /> 答錯了！正確答案是：{currentQ.correctAnswer}
                                        </span>
                                      )}
                                    </div>
                                    <p className="text-xs text-slate-500">
                                      {currentQ.type === 'cloze' ? (
                                        <span>完整例句: <strong className="text-slate-700 font-serif">{currentQ.originalTp}</strong> ({currentQ.sentenceCn})</span>
                                      ) : (
                                        <span>單字: <strong className="text-slate-700">{currentQ.item.tp}</strong> = {currentQ.item.cn} ({currentQ.item.type})</span>
                                      )}
                                    </p>
                                  </div>

                                  <button
                                    onClick={handleNextQuestion}
                                    className="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow transition-all whitespace-nowrap"
                                  >
                                    {currentQuizIndex + 1 < quizQuestions.length ? '下一題' : '查看結算'}
                                  </button>
                                </div>
                              )}
                            </div>
                          );
                        })()}

                        {/* Quiz Result Screen */}
                        {quizState === 'result' && (
                          <div className="bg-white rounded-2xl shadow-xl p-8 border border-slate-200 text-center animate-fadeIn">
                            <div className="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner text-3xl">
                              🎉
                            </div>
                            <h3 className="text-3xl font-bold text-slate-800 mb-2">測驗結算報告</h3>
                            <p className="text-slate-600 mb-6">您已完成本輪 Toki Pona 隨堂測驗！</p>

                            <div className="bg-slate-50 rounded-2xl p-6 border border-slate-200 max-w-sm mx-auto mb-8">
                              <div className="text-sm text-slate-500 mb-1">最終得分</div>
                              <div className="text-4xl font-extrabold text-purple-600 font-mono mb-2">
                                {quizScore} / {quizQuestions.length}
                              </div>
                              <div className="text-xs text-slate-400">
                                正確率: {Math.round((quizScore / quizQuestions.length) * 100)}%
                              </div>
                            </div>

                            <div className="flex flex-col sm:flex-row justify-center gap-4">
                              <button
                                onClick={() => startQuiz(allWordsWithKey)}
                                className="px-6 py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                              >
                                <ArrowClockwise size={20} />
                                再測一次
                              </button>

                              {wrongQuestions.length > 0 && (
                                <button
                                  onClick={() => {
                                    const wrongItems = wrongQuestions.map(q => q.item);
                                    startQuiz(wrongItems);
                                  }}
                                  className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                                >
                                  <X size={20} />
                                  複習錯題 ({wrongQuestions.length}題)
                                </button>
                              )}

                              <button
                                onClick={() => setActiveTab('learn')}
                                className="px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl transition-all"
                              >
                                返回學習首頁
                              </button>
                            </div>
                          </div>
                        )}

                      </div>
                    )}

                  </div>
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
              .then(reg => console.log('ServiceWorker registration successful: ', reg.scope))
              .catch(err => console.log('ServiceWorker registration failed: ', err));
          });
        }
    </script>
</body>
</html>
