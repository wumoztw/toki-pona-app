            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 0.9; 
            utterance.pitch = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            // 優先順序：日文 > 西班牙文 > 義大利文 (母音單純，適合 Toki Pona)

              v.lang.includes('ja') || v.lang.includes('es') || v.lang.includes('it')

                              <div className="flex items-start justify-between w-full">
                                 <div className="flex gap-3 w-full">
                                    <span className="text-indigo-500 font-mono text-sm opacity-50 mt-1 flex-shrink-0">
                                      {selectedCategory.id === 'stories' ? <FileText size={16} /> : `0${i + 1}`}
                                    </span>
                                    <p className="text-lg font-medium text-slate-100 group-hover:text-indigo-300 transition-colors font-serif leading-relaxed w-full">
                                      {sent.tp}
                                    </p>
                                 </div>
                                 <Volume2 size={16} className="opacity-0 group-hover:opacity-50 text-indigo-400 transition-opacity flex-shrink-0 mt-1 ml-2" />
                              </div>
                              
                              <div className="pl-8 border-l-2 border-slate-700 group-hover:border-indigo-500/30 transition-colors ml-1 mt-2">
                                <p className="text-slate-400 text-sm leading-relaxed">
                                  {sent.cn}
                                </p>
                              </div>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
